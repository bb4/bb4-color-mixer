plugins {
    alias(bb4Libs.plugins.scala.library)
    alias(bb4Libs.plugins.publish)
    alias(bb4Libs.plugins.application)
}

description = 'Demo of Porter/Duff compositing rules'
group = 'com.barrybecker4'
version = '3.0-SNAPSHOT'

bb4 {
    archivesBaseName.set('bb4-color-mixer')
    mainClass.set('com.barrybecker4.colormixer.ColorMixer')
}

dependencies {
    implementation bb4Libs.common
    implementation bb4Libs.ui
}

tasks.named('run', JavaExec).configure {
    args '-locale', 'ENGLISH'
    jvmArgs '-ea'
}
